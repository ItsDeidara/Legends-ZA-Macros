<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeManager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4ecca3;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.3);
        }

        .converter-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(30, 30, 46, 0.8);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(78, 204, 163, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        h2 {
            color: #4ecca3;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .format-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .format-btn {
            flex: 1;
            padding: 10px;
            background: rgba(78, 204, 163, 0.1);
            border: 2px solid rgba(78, 204, 163, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .format-btn.active {
            background: rgba(78, 204, 163, 0.3);
            border-color: #4ecca3;
        }

        .format-btn:hover {
            background: rgba(78, 204, 163, 0.2);
        }

        .file-name-display {
            padding: 8px 12px;
            background: rgba(78, 204, 163, 0.1);
            border-radius: 6px;
            color: #4ecca3;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
            font-family: 'Courier New', monospace;
        }

        .file-name-display.visible {
            display: block;
        }

        .url-input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a2e;
            border: 1px solid rgba(78, 204, 163, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 13px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .url-input:focus {
            outline: none;
            border-color: #4ecca3;
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.2);
        }

        .url-input::placeholder {
            color: rgba(224, 224, 224, 0.4);
        }

        .repo-browser {
            margin-bottom: 15px;
        }

        .repo-toggle-btn {
            width: 100%;
            padding: 10px;
            background: rgba(78, 204, 163, 0.15);
            border: 1px solid rgba(78, 204, 163, 0.3);
            border-radius: 8px;
            color: #4ecca3;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .repo-toggle-btn:hover {
            background: rgba(78, 204, 163, 0.25);
            border-color: #4ecca3;
        }

        .repo-browser-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .repo-browser-content.open {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
            background: rgba(26, 26, 46, 0.5);
            border: 1px solid rgba(78, 204, 163, 0.2);
            border-radius: 8px;
            padding: 10px;
        }

        .repo-loading {
            text-align: center;
            color: #4ecca3;
            padding: 20px;
            opacity: 0.7;
        }

        .repo-folder {
            margin-bottom: 10px;
        }

        .repo-folder-name {
            color: #4ecca3;
            font-weight: bold;
            padding: 8px;
            background: rgba(78, 204, 163, 0.1);
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .repo-folder-name:hover {
            background: rgba(78, 204, 163, 0.2);
        }

        .folder-icon {
            font-size: 16px;
        }

        .repo-files {
            margin-left: 20px;
        }

        .repo-file {
            padding: 6px 10px;
            margin: 3px 0;
            background: rgba(78, 204, 163, 0.05);
            border: 1px solid rgba(78, 204, 163, 0.15);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        .repo-file:hover {
            background: rgba(78, 204, 163, 0.15);
            border-color: #4ecca3;
        }

        .repo-file-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .repo-file-name {
            flex: 1;
        }

        .info-icon {
            width: 20px;
            height: 20px;
            background: rgba(78, 204, 163, 0.2);
            border: 1px solid rgba(78, 204, 163, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: #4ecca3;
            flex-shrink: 0;
        }

        .info-icon:hover {
            background: rgba(78, 204, 163, 0.4);
            border-color: #4ecca3;
            transform: scale(1.1);
        }

        .info-icon.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .info-icon.disabled:hover {
            transform: none;
        }

        .create-readme-btn {
            background: rgba(78, 204, 163, 0.1);
            border: 1px solid rgba(78, 204, 163, 0.3);
            border-radius: 4px;
            color: #4ecca3;
            font-size: 12px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .create-readme-btn:hover {
            background: rgba(78, 204, 163, 0.2);
            border-color: #4ecca3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #1e1e2e;
            border: 1px solid rgba(78, 204, 163, 0.3);
            border-radius: 12px;
            max-width: 800px;
            max-height: 80vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(78, 204, 163, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: #4ecca3;
            margin: 0;
            font-size: 1.3em;
        }

        .modal-close {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .readme-content {
            color: #e0e0e0;
            line-height: 1.6;
        }

        .readme-content h1,
        .readme-content h2,
        .readme-content h3 {
            color: #4ecca3;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .readme-content h1 {
            font-size: 1.8em;
            border-bottom: 2px solid rgba(78, 204, 163, 0.3);
            padding-bottom: 0.3em;
        }

        .readme-content h2 {
            font-size: 1.4em;
        }

        .readme-content h3 {
            font-size: 1.2em;
        }

        .readme-content code {
            background: rgba(78, 204, 163, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .readme-content pre {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(78, 204, 163, 0.2);
            overflow-x: auto;
        }

        .readme-content pre code {
            background: none;
            padding: 0;
        }

        .readme-content ul,
        .readme-content ol {
            margin-left: 20px;
        }

        .readme-content a {
            color: #4ecca3;
            text-decoration: none;
        }

        .readme-content a:hover {
            text-decoration: underline;
        }

        .readme-content blockquote {
            border-left: 4px solid #4ecca3;
            margin: 1em 0;
            padding-left: 1em;
            opacity: 0.9;
        }

        .readme-loading {
            text-align: center;
            color: #4ecca3;
            padding: 40px;
            opacity: 0.7;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 340px;
            background: #1a1a2e;
            border: 1px solid rgba(78, 204, 163, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #4ecca3;
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.2);
        }

        .drop-zone {
            width: 100%;
            height: 60px;
            background: rgba(78, 204, 163, 0.05);
            border: 2px dashed rgba(78, 204, 163, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            color: #4ecca3;
        }

        .drop-zone p {
            font-size: 14px;
            opacity: 0.8;
            margin: 0;
        }

        .drop-zone:hover {
            background: rgba(78, 204, 163, 0.1);
            border-color: #4ecca3;
        }

        .drop-zone.drag-over {
            background: rgba(78, 204, 163, 0.2);
            border-color: #4ecca3;
            transform: scale(1.02);
        }

        .drop-zone-content {
            text-align: center;
            color: #4ecca3;
            pointer-events: none;
        }

        .drop-zone-content p {
            font-size: 14px;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #4ecca3 0%, #3a9d7f 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            min-width: 120px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .convert-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%);
            font-size: 16px;
            padding: 15px;
        }

        .convert-btn:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status.success {
            background: rgba(78, 204, 163, 0.2);
            border: 1px solid #4ecca3;
            color: #4ecca3;
            display: block;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            display: block;
        }

        @media (max-width: 968px) {
            .converter-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .missing-readme-btn {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 4px;
            color: #ffa500;
            font-size: 12px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .missing-readme-btn:hover {
            background: rgba(255, 165, 0, 0.2);
            border-color: #ffa500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PokeManager</h1>
        
        <div class="converter-wrapper">
            <div class="panel">
                <h2>Input</h2>
                <div class="panel-content">
                    <div class="format-selector">
                        <button class="format-btn active" data-format="recording">Recording Format</button>
                        <button class="format-btn" data-format="turbo">Turbo Macro Format</button>
                    </div>
                    <div id="fileNameDisplay" class="file-name-display"></div>
                    <div class="repo-browser">
                        <button onclick="toggleRepoBrowser()" class="repo-toggle-btn">Browse Remote Macros</button>
                        <div id="repoBrowserContent" class="repo-browser-content">
                            <div class="repo-loading">Loading macros...</div>
                        </div>
                    </div>
                    <div id="dropZone" class="drop-zone">
                        <p>Drop JSON file here or click to browse</p>
                    </div>
                    <input type="text" id="urlInput" placeholder="Or paste a URL (GitHub raw, Pastebin raw, etc.)" class="url-input">
                    <textarea id="inputJson" placeholder='Paste your JSON here...'></textarea>
                    <input type="file" id="fileInput" accept=".json" style="display: none;">
                    <div class="button-group">
                        <button onclick="clearInput()">Clear</button>
                        <button onclick="openFilePicker()">Open File</button>
                        <button onclick="loadFromUrl()">Load from URL</button>
                        <button onclick="loadSample()">Load Sample</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Output</h2>
                <div class="panel-content">
                    <div class="format-selector">
                        <button class="format-btn" data-format="recording">Recording Format</button>
                        <button class="format-btn active" data-format="turbo">Turbo Macro Format</button>
                    </div>
                    <textarea id="outputJson" placeholder='Converted JSON will appear here...' readonly></textarea>
                    <div class="button-group">
                        <button onclick="copyToClipboard()">Copy to Clipboard</button>
                        <button onclick="downloadJson()">Download JSON</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="convert-btn" onclick="convert()">Convert</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <div id="readmeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Macro Information</h3>
                <button class="modal-close" onclick="closeReadmeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="readmeContent" class="readme-content"></div>
            </div>
        </div>
    </div>

    <script>
        let inputFormat = 'recording';
        let outputFormat = 'turbo';
        let repoData = null;
        let repoBrowserOpen = false;
        let readmeCache = {};

        // GitHub repo configuration
        const REPO_OWNER = 'ItsDeidara';
        const REPO_NAME = 'Legends-ZA-Macros';
        const REPO_BRANCH = 'main';

        // Load repo data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadRepoData();

            // Add real-time conversion for output format changes
            const outputFormatButtons = document.querySelectorAll('.panel:nth-child(2) .format-btn');
            outputFormatButtons.forEach(button => {
                button.addEventListener('click', () => {
                    convert();
                });
            });

            // Add real-time conversion for input JSON changes
            const inputJson = document.getElementById('inputJson');
            inputJson.addEventListener('input', () => {
                convert();
            });
        });

        // Setup drag and drop
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]); // Handle the file
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                showStatus('Please select a JSON file', true);
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let content = e.target.result;
                    
                    // Remove BOM (Byte Order Mark) if present
                    if (content.charCodeAt(0) === 0xFEFF) {
                        content = content.slice(1);
                    }
                    
                    const data = JSON.parse(content);
                    
                    // Auto-detect format based on content structure
                    const detectedFormat = detectFormat(data);
                    if (detectedFormat) {
                        inputFormat = detectedFormat;
                        // Update the active button in the input panel
                        const inputPanel = document.querySelector('.panel:first-child');
                        inputPanel.querySelectorAll('.format-btn').forEach(btn => {
                            btn.classList.remove('active');
                            if (btn.dataset.format === detectedFormat) {
                                btn.classList.add('active');
                            }
                        });
                    }
                    
                    document.getElementById('inputJson').value = content;
                    
                    // Display file name
                    const fileNameDisplay = document.getElementById('fileNameDisplay');
                    fileNameDisplay.textContent = `Loaded: ${file.name} (${detectedFormat === 'recording' ? 'Recording Format' : 'Turbo Macro Format'})`;
                    fileNameDisplay.classList.add('visible');
                    
                    showStatus(`Loaded: ${file.name}`);

                    // Set the output format based on the active button in the output panel
                    const outputPanel = document.querySelector('.panel:nth-child(2)');
                    const activeOutputButton = outputPanel.querySelector('.format-btn.active');
                    if (activeOutputButton) {
                        outputFormat = activeOutputButton.dataset.format;
                    }

                    // Automatically convert the loaded JSON
                    convert();
                } catch (error) {
                    showStatus('Invalid JSON file: ' + error.message, true);
                }
            };
            reader.readAsText(file);
        }

        function detectFormat(data) {
            // Check if it's Recording Format (has controller_class and history)
            if (data.controller_class && data.history && Array.isArray(data.history)) {
                return 'recording';
            }
            
            // Check if it's Turbo Macro Format (array with Action properties)
            if (Array.isArray(data) && data.length > 0 && data[0].Action) {
                return 'turbo';
            }
            
            return null;
        }

        function openFilePicker() {
            fileInput.click();
        }

        async function loadRepoData() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${REPO_BRANCH}?recursive=1`);
                const data = await response.json();

                // Organize files by folder and match readmes to JSON files
                const folders = {};
                const readmes = {};

                // First pass: collect all .md files
                data.tree.forEach(item => {
                    if (item.type === 'blob' && item.path.toLowerCase().endsWith('.md')) {
                        const dirPath = item.path.split('/').slice(0, -1).join('/');
                        if (!readmes[dirPath]) {
                            readmes[dirPath] = [];
                        }
                        readmes[dirPath].push({
                            name: item.path.split('/').pop(),
                            url: `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/${item.path}`
                        });
                    }
                });

                // Second pass: collect JSON files and match with any .md file in the same directory
                data.tree.forEach(item => {
                    if (item.type === 'blob' && item.path.endsWith('.json')) {
                        const parts = item.path.split('/');
                        if (parts.length > 1) {
                            const folder = parts[0];
                            const fileName = parts[parts.length - 1];
                            const dirPath = parts.slice(0, -1).join('/');

                            // Find any .md file in the same directory
                            const readmeFiles = readmes[dirPath] || [];
                            const readmeUrl = readmeFiles.length > 0 ? readmeFiles[0].url : null;

                            if (!folders[folder]) {
                                folders[folder] = [];
                            }

                            folders[folder].push({
                                name: fileName,
                                path: item.path,
                                url: `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/${item.path}`,
                                readmeUrl: readmeUrl
                            });
                        }
                    }
                });

                repoData = { folders, readmes };
                renderRepoContent();
            } catch (error) {
                console.error('Error loading repo data:', error);
                document.querySelector('.repo-loading').textContent = 'Error loading macros';
            }
        }

        function renderRepoContent() {
            const content = document.getElementById('repoBrowserContent');

            if (!repoData || Object.keys(repoData.folders).length === 0) {
                content.innerHTML = '<div class="repo-loading">No macros found</div>';
                return;
            }

            let html = '';
            for (const [folder, files] of Object.entries(repoData.folders)) {
                html += `
                    <div class="repo-folder">
                        <div class="repo-folder-name">
                            <span class="folder-icon">📁</span>
                            <span>${folder}</span>
                        </div>
                        <div class="repo-files">
                `;

                // Group files by their subfolder structure
                const subfolders = {};
                files.forEach(file => {
                    const parts = file.path.split('/');
                    const subfolder = parts.slice(1, -1).join('/') || 'root';
                    if (!subfolders[subfolder]) {
                        subfolders[subfolder] = [];
                    }
                    subfolders[subfolder].push(file);
                });

                // Render files within their respective subfolders
                for (const [subfolder, subfolderFiles] of Object.entries(subfolders)) {
                    if (subfolder !== 'root') {
                        html += `
                            <div class="repo-folder">
                                <div class="repo-folder-name">
                                    <span class="folder-icon">📂</span>
                                    <span>${subfolder}</span>
                                </div>
                                <div class="repo-files">
                        `;
                    }

                    subfolderFiles.forEach(file => {
                        const hasReadme = file.readmeUrl;
                        html += `
                            <div class="repo-file" onclick="loadRepoFile('${file.url}', '${file.name}')">
                                <div class="repo-file-container">
                                    <span class="repo-file-name">${file.name}</span>
                                    ${hasReadme ? `
                                        <span class="info-icon" onclick="event.stopPropagation(); loadReadme('${file.name}', '${file.readmeUrl}')" title="View README">i</span>
                                    ` : `
                                        <button class="missing-readme-btn" onclick="event.stopPropagation(); createReadme('${file.name}')">Missing README</button>
                                    `}
                                </div>
                            </div>
                        `;
                    });

                    if (subfolder !== 'root') {
                        html += `
                                </div>
                            </div>
                        `;
                    }
                }

                html += `
                        </div>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        function toggleRepoBrowser() {
            const content = document.getElementById('repoBrowserContent');
            repoBrowserOpen = !repoBrowserOpen;
            
            if (repoBrowserOpen) {
                content.classList.add('open');
            } else {
                content.classList.remove('open');
            }
        }

        async function loadRepoFile(url, fileName) {
            try {
                showStatus('Loading ' + fileName + '...');
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                let content = await response.text();
                
                // Remove BOM if present
                if (content.charCodeAt(0) === 0xFEFF) {
                    content = content.slice(1);
                }
                
                const data = JSON.parse(content);
                
                // Auto-detect format
                const detectedFormat = detectFormat(data);
                if (detectedFormat) {
                    inputFormat = detectedFormat;
                    const inputPanel = document.querySelector('.panel:first-child');
                    inputPanel.querySelectorAll('.format-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.format === detectedFormat) {
                            btn.classList.add('active');
                        }
                    });
                }
                
                document.getElementById('inputJson').value = content;
                
                // Display file info
                const fileNameDisplay = document.getElementById('fileNameDisplay');
                fileNameDisplay.textContent = `Loaded: ${fileName} (${detectedFormat === 'recording' ? 'Recording Format' : 'Turbo Macro Format'})`;
                fileNameDisplay.classList.add('visible');
                
                showStatus('Loaded ' + fileName + ' successfully!');

                // Automatically convert the loaded JSON
                convert();
            } catch (error) {
                showStatus('Error loading file: ' + error.message, true);
            }
        }

        async function loadReadme(fileName, readmeUrl) {
            const modal = document.getElementById('readmeModal');
            const modalTitle = document.getElementById('modalTitle');
            const readmeContent = document.getElementById('readmeContent');
            
            modalTitle.textContent = `${fileName} - Information`;
            readmeContent.innerHTML = '<div class="readme-loading">Loading README...</div>';
            modal.classList.add('open');
            
            // Check cache first
            if (readmeCache[readmeUrl]) {
                readmeContent.innerHTML = readmeCache[readmeUrl];
                return;
            }
            
            try {
                const response = await fetch(readmeUrl);
                if (!response.ok) {
                    throw new Error('README not found');
                }
                
                const markdown = await response.text();
                const html = parseMarkdown(markdown);
                
                readmeCache[readmeUrl] = html;
                readmeContent.innerHTML = html;
            } catch (error) {
                readmeContent.innerHTML = `<div class="readme-loading">Error loading README: ${error.message}</div>`;
            }
        }

        function parseMarkdown(markdown) {
            let html = markdown;
            
            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
            
            // Italic
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');
            
            // Code blocks
            html = html.replace(/```(.*?)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Blockquotes
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            
            // Unordered lists
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            
            // Line breaks
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            
            // Clean up empty paragraphs
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(<h[1-6]>)/g, '$1');
            html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<pre>)/g, '$1');
            html = html.replace(/(<\/pre>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)<\/p>/g, '$1');
            html = html.replace(/<p>(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
            
            return html;
        }

        function closeReadmeModal() {
            const modal = document.getElementById('readmeModal');
            modal.classList.remove('open');
        }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('readmeModal');
            if (e.target === modal) {
                closeReadmeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeReadmeModal();
            }
        });

        // Format selector buttons
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const panel = this.closest('.panel');
                const isInput = panel.querySelector('#inputJson');
                const format = this.dataset.format;
                
                panel.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                if (isInput) {
                    inputFormat = format;
                } else {
                    outputFormat = format;
                }
                
                // Clear output when format changes
                document.getElementById('outputJson').value = '';
            });
        });

        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function clearInput() {
            document.getElementById('inputJson').value = '';
            document.getElementById('outputJson').value = '';
            document.getElementById('urlInput').value = '';
            
            // Hide file name display
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            fileNameDisplay.classList.remove('visible');
        }

        async function loadFromUrl() {
            const urlInput = document.getElementById('urlInput');
            let url = urlInput.value.trim();
            
            if (!url) {
                showStatus('Please enter a URL', true);
                return;
            }
            
            // Convert regular GitHub URLs to raw URLs
            if (url.includes('github.com') && !url.includes('raw.githubusercontent.com')) {
                url = url.replace('github.com', 'raw.githubusercontent.com')
                         .replace('/blob/', '/');
            }
            
            // Convert regular Pastebin URLs to raw URLs
            if (url.includes('pastebin.com/') && !url.includes('pastebin.com/raw/')) {
                url = url.replace('pastebin.com/', 'pastebin.com/raw/');
            }
            
            try {
                showStatus('Loading from URL...');
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                let content = await response.text();
                
                // Remove BOM if present
                if (content.charCodeAt(0) === 0xFEFF) {
                    content = content.slice(1);
                }
                
                const data = JSON.parse(content);
                
                // Auto-detect format
                const detectedFormat = detectFormat(data);
                if (detectedFormat) {
                    inputFormat = detectedFormat;
                    const inputPanel = document.querySelector('.panel:first-child');
                    inputPanel.querySelectorAll('.format-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.format === detectedFormat) {
                            btn.classList.add('active');
                        }
                    });
                }
                
                document.getElementById('inputJson').value = content;
                
                // Display URL info
                const fileNameDisplay = document.getElementById('fileNameDisplay');
                const urlParts = url.split('/');
                const fileName = urlParts[urlParts.length - 1] || 'remote file';
                fileNameDisplay.textContent = `Loaded: ${fileName} (${detectedFormat === 'recording' ? 'Recording Format' : 'Turbo Macro Format'})`;
                fileNameDisplay.classList.add('visible');
                
                showStatus('Loaded from URL successfully!');
            } catch (error) {
                showStatus('Error loading from URL: ' + error.message, true);
            }
        }

        function loadSample() {
            const sample = inputFormat === 'recording' ? 
                `{
    "controller_class": "NS1: Pro Controller",
    "history": [
        {
            "buttons": "none",
            "dpad": "none",
            "duration_in_ms": 87,
            "is_neutral": false,
            "left_x": 128,
            "left_y": 0,
            "right_x": 128,
            "right_y": 128
        },
        {
            "buttons": "A",
            "dpad": "none",
            "duration_in_ms": 126,
            "is_neutral": false,
            "left_x": 128,

            "right_y": 128
        }
    ]
}` : 
                `[
    {
        "Action": "left-joystick",

            const fileNameDisplay = document.getElementById('fileNameDisplay');

        }

        function recordingToTurbo(data) {
            const result = [];
            
            for (const entry of data.history) {
                if (entry.is_neutral) {
                    result.push({
                        Action: "wait",
                        WaitMs: `${entry.duration_in_ms} ms`
                    });
                } else {
                    const hasJoystick = entry.left_x !== 128 || entry.left_y !== 128;
                    const hasButton = entry.buttons && entry.buttons !== 'none';
                    
                    if (hasJoystick && hasButton) {
                        result.push({
                            Action: "left-joystick",
                            HoldMs: `${entry.duration_in_ms} ms`,
                            MoveDirectionX: entry.left_x,
                            MoveDirectionY: entry.left_y,
                            ReleaseMs: "0 ms"
                        });
                        
                        const buttonMap = {
                            'A': 'button-A',
                            'B': 'button-B',
                            'X': 'button-X',
                            'Y': 'button-Y',
                            '+': 'button-plus',
                            '-': 'button-minus'
                        };
                        
                        result.push({
                            Action: buttonMap[entry.buttons] || `button-${entry.buttons}`,
                            HoldMs: "100 ms",
                            ReleaseMs: "0 ms"
                        });
                    } else if (hasJoystick) {
                        result.push({
                            Action: "left-joystick",
                            HoldMs: `${entry.duration_in_ms} ms`,
                            MoveDirectionX: entry.left_x,
                            MoveDirectionY: entry.left_y,
                            ReleaseMs: "0 ms"
                        });
                    } else if (hasButton) {
                        const buttonMap = {
                            'A': 'button-A',
                            'B': 'button-B',
                            'X': 'button-X',
                            'Y': 'button-Y',
                            '+': 'button-plus',
                            '-': 'button-minus'
                        };
                        
                        result.push({
                            Action: buttonMap[entry.buttons] || `button-${entry.buttons}`,
                            HoldMs: `${entry.duration_in_ms} ms`,
                            ReleaseMs: "0 ms"
                        });
                    }
                }
            }
            
            return result;
        }

        function turboToRecording(data) {
            const history = [];
            
            for (const action of data) {
                if (action.Action === "wait") {
                    history.push({
                        duration_in_ms: parseInt(action.WaitMs),
                        is_neutral: true
                    });
                } else if (action.Action === "left-joystick") {
                    history.push({
                        buttons: "none",
                        dpad: "none",
                        duration_in_ms: parseInt(action.HoldMs),
                        is_neutral: false,
                        left_x: action.MoveDirectionX,
                        left_y: action.MoveDirectionY,
                        right_x: 128,
                        right_y: 128
                    });
                    
                    const releaseMs = parseInt(action.ReleaseMs);
                    if (releaseMs > 0) {
                        history.push({
                            duration_in_ms: releaseMs,
                            is_neutral: true
                        });
                    }
                } else if (action.Action.startsWith("button-")) {
                    const buttonMap = {
                        'button-A': 'A',
                        'button-B': 'B',
                        'button-X': 'X',
                        'button-Y': 'Y',
                        'button-plus': '+',
                        'button-minus': '-'
                    };
                    
                    const button = buttonMap[action.Action] || action.Action.replace('button-', '');
                    
                    history.push({
                        buttons: button,
                        dpad: "none",
                        duration_in_ms: parseInt(action.HoldMs),
                        is_neutral: false,
                        left_x: 128,
                        left_y: 128,
                        right_x: 128,
                        right_y: 128
                    });
                    
                    const releaseMs = parseInt(action.ReleaseMs);
                    if (releaseMs > 0) {
                        history.push({
                            duration_in_ms: releaseMs,
                            is_neutral: true
                        });
                    }
                }
            }
            
            return {
                controller_class: "NS1: Pro Controller",
                history: history
            };
        }

        function convert() {
            const input = document.getElementById('inputJson').value.trim();
            
            if (!input) {
                showStatus('Please enter JSON to convert', true);
                return;
            }
            
            try {
                const data = JSON.parse(input);
                let result;
                
                if (inputFormat === 'recording' && outputFormat === 'turbo') {
                    result = recordingToTurbo(data);
                } else if (inputFormat === 'turbo' && outputFormat === 'recording') {
                    result = turboToRecording(data);
                } else if (inputFormat === outputFormat) {
                    // Same format - just pretty print it for download purposes
                    result = data;
                } else {
                    showStatus('Please select different input and output formats', true);
                    return;
                }
                
                document.getElementById('outputJson').value = JSON.stringify(result, null, 4);
                showStatus('Conversion successful!');
            } catch (error) {
                showStatus('Error: ' + error.message, true);
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('outputJson');
            if (!output.value) {
                showStatus('Nothing to copy', true);
                return;
            }
            
            output.select();
            document.execCommand('copy');
            showStatus('Copied to clipboard!');
        }

        function downloadJson() {
            const output = document.getElementById('outputJson').value;
            if (!output) {
                showStatus('Nothing to download', true);
                return;
            }
            
            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `converted_${outputFormat}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('Download started!');
        }

        function createReadme(fileName) {
            const modal = document.getElementById('readmeModal');
            const modalTitle = document.getElementById('modalTitle');
            const readmeContent = document.getElementById('readmeContent');

            // Set modal title and pre-fill content with a template
            modalTitle.textContent = `Create README for ${fileName}`;
            readmeContent.innerHTML = `
                <textarea id="readmeEditor" class="readme-editor">
# ${fileName}
This is a placeholder README for the macro file **${fileName}**. Please update this content to describe the macro's purpose, usage, and any other relevant details.

## Instructions
- Include usage instructions or examples.

## Notes
- This README was generated as a template. Replace this text with any notes you may have
                </textarea>
                <div class="button-group">
                    <button onclick="downloadReadme('${fileName}')">Download README</button>
                </div>
            `;

            // Open the modal
            modal.classList.add('open');
        }

        function downloadReadme(fileName) {
            const content = document.getElementById('readmeEditor').value;
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileName.replace('.json', '')}_README.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('README downloaded successfully!');
        }
    </script>
